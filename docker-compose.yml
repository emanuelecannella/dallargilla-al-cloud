# Avvio dell'intero sistema: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - dati_db:/var/lib/postgresql/data   # i dati restano anche se il container viene ricreato
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy   # parte solo quando il database è pronto
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_TARGET: http://backend:8000   # le chiamate /api vengono girate al container del back-end
      VITE_POLLING: "true"                   # rileva le modifiche ai file anche su Mac e Windows
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app          # il codice del front-end si modifica dal computer e si aggiorna da solo
      - /app/node_modules        # le librerie restano quelle installate nel container

volumes:
  dati_db:
